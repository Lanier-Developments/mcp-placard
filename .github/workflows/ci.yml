name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src/

      - name: No tool invocation
        # The hard non-goal from AGENTS.md, enforced mechanically rather than by
        # review attention. Placard must never be able to call a tool.
        run: python scripts/check_no_tool_invocation.py

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest with coverage
        # The 85% floor on src/ is enforced by [tool.coverage.report] fail_under.
        # AGENTS.md: do not lower it to make a PR pass.
        run: pytest --cov=src/mcp_placard --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  self-gate:
    name: Placard gates itself (via the action)
    runs-on: ubuntu-latest
    # AGENTS.md: "CI also runs Placard against its own mock server and diffs the
    # result against a checked-in manifest — the tool gates itself." Since Phase 4
    # the gate *is* the GitHub Action, running from this checkout: hash-pinned
    # dependencies, Placard installed from the repository at this SHA, the mock
    # server scanned in an isolated environment, and the diff against
    # tests/fixtures/mock_server_manifest.json rendered as a step summary and
    # uploaded as SARIF. Every category fails here, removal included.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run the action from this checkout
        id: placard
        uses: ./
        with:
          config: placard.toml
          fail-on: escalation,prompt,removal,injection,incomplete
          sarif: true
          summary: true

      - name: Outputs are the bitmask and one boolean per category
        env:
          RC: ${{ steps.placard.outputs.exit-code }}
          ESC: ${{ steps.placard.outputs.escalation }}
          PROMPT: ${{ steps.placard.outputs.prompt }}
          INC: ${{ steps.placard.outputs.incomplete }}
        run: |
          test "$RC" -eq 0 || { echo "expected bitmask 0, got $RC"; exit 1; }
          test "$ESC" = "false" && test "$PROMPT" = "false" && test "$INC" = "false"

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The mock server's surface drifted from the checked-in manifest."
          echo "If the change is intended, regenerate the baseline deliberately:"
          echo "  placard baseline --config placard.toml"
          echo "Regenerating it to make a red build green is adversary A5 in docs/THREAT_MODEL.md."

  drift-detection-works:
    name: Drift detection actually fires
    runs-on: ubuntu-latest
    # A gate that can only pass is not a gate. This job mutates the mock server and
    # asserts that each documented exit code is produced, so a diff engine that
    # silently stopped detecting anything fails CI instead of passing it.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Scan the mutated surfaces
        run: |
          placard scan "python -m tests.mock_server --description-variant b" \
            --out described.json
          placard scan "python -m tests.mock_server --add-tool" --out added.json
          placard scan "python -m tests.mock_server --drop-tool delete_workspace" \
            --out removed.json

      - name: A rewritten description must exit 2
        run: |
          set +e
          placard diff tests/fixtures/mock_server_manifest.json described.json
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: An added tool must exit 1
        run: |
          set +e
          placard diff tests/fixtures/mock_server_manifest.json added.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: A removed tool must set bit 4 and nothing else
        run: |
          set +e
          placard diff tests/fixtures/mock_server_manifest.json removed.json
          code=$?
          set -e
          test "$code" -eq 4 || { echo "expected exit 4, got $code"; exit 1; }

      - name: Mixed findings OR their bits — no category masks another
        run: |
          placard scan "python -m tests.mock_server --add-tool --description-variant b" \
            --out added_and_described.json
          set +e
          placard diff tests/fixtures/mock_server_manifest.json added_and_described.json
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit 3 (1|2), got $code"; exit 1; }

      - name: A tampered manifest must fail verification
        run: |
          python - <<'PY'
          import json, pathlib
          document = json.loads(pathlib.Path("added.json").read_text())
          document["surface"]["tools"][0]["description"] = "quietly rewritten"
          pathlib.Path("tampered.json").write_text(json.dumps(document))
          PY
          set +e
          placard verify tampered.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
