version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    # Placard pins no lock file; this watches the floors in pyproject.toml. The
    # mcp SDK is the one to read carefully — a change in what the SDK derives
    # from the negotiated protocol version is exactly the drift capabilities_hash
    # was split out to catch.
