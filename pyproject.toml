[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-placard"
version = "0.3.1"
description = "Static analysis and drift detection for the surface an MCP server exposes to an agent."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lanier Developments" }]
keywords = ["mcp", "security", "static-analysis", "supply-chain", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "mcp>=2.2.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "anyio>=4.4",
]

[project.urls]
Homepage = "https://github.com/Lanier-Developments/mcp-placard"
Source = "https://github.com/Lanier-Developments/mcp-placard"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "coverage>=7.5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
placard = "mcp_placard.cli:main"
mcp-placard = "mcp_placard.cli:main"

[tool.hatch.build.targets.sdist]
# Ship the package, its tests, and the public docs. The dated dispatch memos under
# docs/dispatches/ are repo history, not distribution.
exclude = [
  "/docs/dispatches",
  "/.github",
  "/.pre-commit-config.yaml",
  "/CODE_OF_CONDUCT.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_placard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "C4",  # comprehensions
  "SIM", # simplify
  "RUF", # ruff-specific
  "ANN", # annotations
  "S",   # bandit
]
ignore = [
  "ANN401", # Any is unavoidable for raw JSON Schema payloads
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: integration tests that spawn a subprocess MCP server",
]
filterwarnings = ["error::DeprecationWarning:mcp_placard.*"]

[tool.coverage.run]
source = ["src/mcp_placard"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
